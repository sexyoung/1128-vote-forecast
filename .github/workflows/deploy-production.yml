name: Vercel Production

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 刻意不開 cancel-in-progress：正式部署跑到一半被砍掉，會留下「資料庫已經
# migrate 了但程式沒上去」這個最難收拾的狀態。
concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Apply migrations
        # migrate 用 session/direct 連線；secret 放 Repository，不要求公開 repo
        # 或付費的 GitHub Environment。
        run: npx prisma migrate deploy

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production

      - name: Build
        run: vercel build --prod

      - name: Deploy prebuilt output
        id: deploy
        # 網域由下一步明確指定，避免正式部署把測站網域一起接走。
        run: echo "url=$(vercel deploy --prebuilt --prod --skip-domain --archive=tgz)" >> "$GITHUB_OUTPUT"

      - name: Point production domain
        run: vercel alias set "${{ steps.deploy.outputs.url }}" 1128predict.sexyoung.tw

      - name: Report
        run: echo "Production -> https://1128predict.sexyoung.tw (${{ steps.deploy.outputs.url }})" >> "$GITHUB_STEP_SUMMARY"
